[build-system]
requires = [ "setuptools>=60", "setuptools-scm>=8" ]

[project]
name = "anemoi-transform"
description = "A package to hold various data transformation functions to support training of ML models on ECMWF data."
readme = "README.md"
keywords = [ "ai", "tools" ]
license = { file = "LICENSE" }
authors = [
  { name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = [ "version" ]
dependencies = [
  "anemoi-utils>=0.5.4",
  "cfunits",
  "earthkit-data>=0.12.4,<1",
  "earthkit-geo>=0.3,<1",
  "earthkit-meteo>=0.4.1,<1",
  "earthkit-regrid>=0.4,<1",
  "healpy",
  "pandas<3",
  # https://github.com/ecmwf/anemoi-transform/issues/345
  "pyproj<3.8",
]
optional-dependencies.all = [ "anemoi-transform[plots]" ]
optional-dependencies.dev = [ "anemoi-transform[all,docs,tests]" ]
optional-dependencies.docs = [
  "nbsphinx",
  "numpydoc",
  "pandoc",
  "requests",
  "ruamel-yaml>=0.16",
  "sphinx>=8.2",
  "sphinx-argparse<0.5",
  "sphinx-rtd-theme",
  "termcolor",
]
optional-dependencies.plots = [ "matplotlib" ]
optional-dependencies.tests = [ "pytest", "pytest-skip-slow" ]
urls.Documentation = "https://anemoi-transform.readthedocs.io/"
urls.Homepage = "https://github.com/ecmwf/anemoi-transform/"
urls.Issues = "https://github.com/ecmwf/anemoi-transform/issues"
urls.Repository = "https://github.com/ecmwf/anemoi-transform/"
scripts.anemoi-transform = "anemoi.transform.__main__:main"

[tool.setuptools]
package-data."anemoi.transform" = [ "py.typed" ]

[tool.setuptools_scm]
version_file = "src/anemoi/transform/_version.py"

[tool.ruff]
line-length = 120
# This library represents time as numpy/pandas datetime64, which cannot carry a
# timezone: the data model is naive-UTC throughout. The flake8-datetimez rules
# assume timezone-aware datetimes are always wanted, which does not hold here --
# making these values tz-aware breaks comparison against datetime64[ns] columns
# and conversion via np.datetime64().
lint.ignore = [ "DTZ" ]
# Modules in commands/ are auto-registered as CLI subcommands by filename (see
# commands/__init__.py), so the filenames define the public interface -- e.g.
# "anemoi-transform get-grid". Hyphens are required and renaming them to satisfy
# N999 would be a breaking change to the command line. Applied to the whole
# directory so new commands do not need to be listed here individually.
lint.per-file-ignores."src/anemoi/transform/commands/*.py" = [ "N999" ]
# Ruff's default rule set is used. Import sorting must stay consistent with the
# isort pre-commit hook, which runs with --force-single-line-imports; without
# this, ruff and isort rewrite each other's output and pre-commit never reaches
# a fixed point.
lint.isort.force-single-line = true

[tool.mypy]
exclude = [
  "docs/*",
]
disable_error_code = [ "import-untyped" ]
strict = false

[tool.pydocstringformatter]
write = true
exclude = "docs/*"
style = "numpydoc"
